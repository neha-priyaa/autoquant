meta:
  slug: all-weather-built-and-tested-against-inverse-vol-erc-and-a-6
  title: All Weather built and tested against inverse vol, ERC and a 60/40
  url: https://quanterlab.com/research/dalio-s-all-weather-constructed-and-then-tested-against-inverse-volatility-equal
  source: Quanter Lab
  posted: 2026-09-02
  claim: 'An equal-risk-contribution portfolio on SPY/TLT/IEF/GLD/DBC, levered ex
    ante to the trailing volatility of a 60/40 SPY/AGG reference, clamped between
    0.5x and 2.0x, and financed at the point-in-time 3-month T-bill plus 50 bps, clears
    the 60/40 on risk-adjusted return net of financing.

    '
  author_evidence:
    sample: "2008-01-02 \u2192 2025-12-31, eighteen one-year windows anchored each\
      \ January, SPY/TLT/IEF/GLD/DBC total return, quarterly rebalance, 10 bps one-way"
    headline_metrics:
      cagr: 0.0702
      sharpe: 0.64
      max_dd: -0.277
    costs_included: true
data:
  universe:
  - SPY
  - TLT
  - IEF
  - GLD
  - DBC
  - AGG
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2006-02-01
  end: null
  source: yfinance
  caveats:
  - AGG is reference-only data for the vol target and benchmark, never traded.
  - The article uses total return with dividends credited from the payment record;
    yfinance adjusted close approximates this.
  - DBC's first bar is February 2006, which dates the earliest usable start; the article's
    walk begins 2008-01-02 after the 252-day estimation warm-up.
  - The article's entire 2008-2025 span predates the 2026-09-02 publication date,
    so it is all in-sample from this pipeline's perspective; validation.oos_start
    is 2026-09-02.
  - Financing requires a point-in-time 3-month T-bill series (e.g. FRED DTB3), which
    is external to yfinance price data.
signal:
  definition: 'ret = adjusted_close.pct_change(); cov = ret.rolling(252).cov(); w_erc
    = long-only weights solving w_i * (cov @ w)_i equal across the five sleeves (each
    contributes 1/5 of portfolio variance), sum(w) = 1; book_vol = sqrt(w_erc'' @
    cov @ w_erc); ref = 0.60 * ret_SPY + 0.40 * ret_AGG (60/40 rebalanced monthly);
    ref_vol = ref.rolling(252).std() * sqrt(252); gross = clip(ref_vol / book_vol,
    0.5, 2.0), reset once per year at the January anchor while w_erc re-estimates
    at each quarterly rebalance, all from data available on the rebalance date; final
    weights = gross * w_erc; decision uses data through bar t-1 (lag_bars 1).

    '
  lookback_bars: 252
  lag_bars: 1
rules:
  entry: always invested; weights reset to gross * w_erc at each quarterly rebalance
  exit: never flat; only weight drift between rebalances
  direction: long_only
  position_when_flat: cash
  sizing: vol_target
  vol_target: null
  max_leverage: 2.0
  rebalance: quarterly
  execution_price: next_open
costs:
  commission_bps: 0.0
  slippage_bps: 10.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 50.0
ambiguities:
- id: execution_timing
  question: "Rebalances use point-in-time data at the anchor, but the article never\
    \ states the execution price \u2014 same close or next open?"
  default: next_open
  alternatives:
  - same_close
  material: false
- id: covariance_estimator
  question: Which covariance estimator feeds the ERC solve over the trailing 252 trading
    days?
  default: simple_sample_covariance
  alternatives:
  - ledoit_wolf_shrinkage
  - ewma
  material: false
- id: erc_solver
  question: The article says the ERC weights are 'solved' but names no algorithm;
    which solver equality convention applies?
  default: numerical_solve_risk_contributions_equal_long_only
  alternatives:
  - inverse_vol_times_avg_correlation_approximation
  material: false
- id: vol_target_reference
  question: "The vol target is 'the trailing volatility of a 60/40 SPY/AGG', not a\
    \ fixed number \u2014 trailing over what window, and with what rebalance of the\
    \ reference?"
  default: trailing_252d_vol_of_monthly_rebalanced_60_40
  alternatives:
  - fixed_0_119_realized_target
  material: false
- id: financing_base_rate
  question: "financing_bps_annual carries only the 50 bp spread; the base is the point-in-time\
    \ 3-month T-bill, which needs an external rate series \u2014 flat bill or point-in-time?"
  default: point_in_time_3m_tbill
  alternatives:
  - flat_sample_average_bill
  material: false
- id: cost_split
  question: The article charges 10 bps per one-way traded dollar combined but never
    splits commission from slippage.
  default: slippage_10_commission_0
  alternatives:
  - commission_5_slippage_5
  material: false
validation:
  oos_start: 2026-09-02
  is_oos_split: publication_date
  param_sweep:
    lookback_bars:
    - 126
    - 189
    - 252
    - 378
    - 504
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 20
  - 50
  null_tests:
  - random_entry_matched_exposure
  - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
  report: reports/all-weather-built-and-tested-against-inverse-vol-erc-and-a-6.md
