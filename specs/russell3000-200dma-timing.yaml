meta:
  slug: russell3000-200dma-timing
  title: "Timing Russell 3000 with the 200-day moving average"
  url: https://example.com/200dma
  source: "Demo — template example instantiated"
  posted: 2015-01-01
  claim: >
    Holding ^RUA only when it is above its 200-day moving average beats
    buy-and-hold on risk-adjusted return.
  author_evidence:
    sample: "1950-2024, SPY/S&P 500 total return"
    headline_metrics: {cagr: 0.098, sharpe: 0.72, max_dd: -0.28}
    costs_included: false

data:
  universe: [^RUA]
  bar: 1d
  fields: [open, high, low, close, volume]
  start: 1988-01-04
  end: null
  source: yfinance
  caveats:
    - "yfinance prices are split/dividend adjusted; the article may use price-only."
    - "Cash earns 0% when flat; the author may assume T-bills."

signal:
  definition: "sma = close.rolling(lookback_bars).mean(); raw = close > sma"
  lookback_bars: 200
  lag_bars: 1

rules:
  entry: "raw becomes True"
  exit: "raw becomes False"
  direction: long_only
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: on_signal_change
  execution_price: next_open

costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0

ambiguities:
  - id: execution_timing
    question: "Signal computed on the close — can you trade that same close?"
    default: next_open
    alternatives: [same_close]
    material: true
  - id: ma_type
    question: "Simple or exponential 200-day average?"
    default: simple
    alternatives: [exponential]
    material: false
  - id: flat_asset
    question: "Cash at 0%, or T-bills, when out of the market?"
    default: cash_zero
    alternatives: [tbill_3m]
    material: true

validation:
  oos_start: 2015-01-01
  is_oos_split: publication_date
  param_sweep:
    lookback_bars: [100, 150, 200, 250, 300]
  cost_sweep_bps: [0, 5, 10, 20, 50]
  null_tests:
    - random_entry_matched_exposure
  min_trades: 30
  multiple_testing:
    n_tested_so_far: 4
    method: deflated_sharpe

verdict:
  status: PENDING
  reason: null
  report: reports/russell3000-200dma-timing.md
