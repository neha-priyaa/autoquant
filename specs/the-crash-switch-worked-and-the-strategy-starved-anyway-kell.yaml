meta:
  slug: the-crash-switch-worked-and-the-strategy-starved-anyway-kell
  title: 'The Crash Switch Worked and the Strategy Starved Anyway: Keller''s Menu
    Tested'
  url: https://quanterlab.com/research/the-crash-switch-worked-and-the-strategy-starved-anyway-keller-s-menu-tested
  source: Quanter Lab
  posted: 2026-08-24
  claim: 'Raising Keller BAA-G4''s canary breadth floor from one to two non-positive
    canaries improves risk-adjusted return by about 3.6 points a year while preserving
    the 2022 crash protection of the published single-bird gate.

    '
  author_evidence:
    sample: 17 registered walk-forward windows, 2009-01-02 to 2025-12-31, tradable
      ETFs, total return net of 10 bps per one-way traded dollar
    headline_metrics:
      cagr: 0.0901
      sharpe: 0.68
      max_dd: -0.242
    costs_included: true
data:
  universe:
  - QQQ
  - VWO
  - VEA
  - BND
  - TIP
  - DBC
  - BIL
  - IEF
  - TLT
  - LQD
  - AGG
  - SPY
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2007-07-01
  end: null
  source: yfinance
  caveats:
  - VEA, BND and BIL trade only from mid-2007, so the 2008 crash is outside any record
    built from the tradable funds (the article starts its windows in 2009 for this
    reason).
  - Article credits distributions on ex-dates and notes vendor adjusted-price history
    revises as distributions post, changing window-level results between re-runs.
  - Article credits dividends gross of withholding; dividend-adjusted closes do not
    reproduce that exactly.
  - All 12 names are live listed ETFs named in Keller's published menus; survivorship
    risk is minimal but the menus are name-selected from a 2022 paper.
signal:
  definition: 'month_end = close.resample(''ME'').last(); sel = month_end / month_end.rolling(13).mean();
    r_n = month_end.pct_change(n); canary = (12*r_1 + 4*r_3 + 2*r_6 + 1*r_12) / 4
    for each of SPY, VWO, VEA, BND; breadth = (canary <= 0).sum(axis=1); if breadth
    >= breadth_min: defensive book = equal-weight top-3 of [TIP, DBC, BIL, IEF, TLT,
    LQD, AGG] by sel, with any slot whose sel is below the 1-month T-bill return replaced
    by BIL; else: offensive book = 100% in the single highest-sel fund of [QQQ, VWO,
    VEA, BND]'
  lookback_bars: 280
  lag_bars: 1
rules:
  entry: At each month end, if fewer than breadth_min canaries have 13612W <= 0, hold
    the top-1 offensive fund; otherwise hold the defensive top-3 book
  exit: 'Re-selection at each month end: the prior book is exited and replaced whenever
    the regime or ranked holdings change'
  direction: long_only
  position_when_flat: alternative_asset
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: monthly
  execution_price: next_open
costs:
  commission_bps: 10.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: headline_arm
  question: The article walks four registered pairs; which breadth setting does the
    spec's default arm run?
  default: breadth_min = 2 (two-bird floor, the article's recommended repair)
  alternatives:
  - breadth_min = 1 (as Keller published)
  - breadth_min = 3
  - breadth_min = 4
  - graded response scaled by bad-bird count
  material: true
- id: defensive_weighting
  question: How is capital split across the three defensive slots?
  default: equal thirds, as in Keller's published design
  alternatives:
  - momentum_weighted
  material: false
- id: defensive_veto_asset
  question: "Slots scoring below one-month T-bills are 'replaced by them' \u2014 held\
    \ as what?"
  default: BIL (the published T-bill ETF in the defensive menu)
  alternatives:
  - cash_zero_yield
  - tbill_3m_index_return
  material: true
- id: tbill_momentum_proxy
  question: What proxy supplies the 1-month T-bill return used in the defensive replacement
    filter?
  default: BIL's own 1-month total return
  alternatives:
  - zero_return
  - irx_13week_index
  material: false
- id: execution_timing
  question: Article states next-day-after-month-end execution; its own sensitivity
    shows close-on-close adds 1.3-1.8 points a year to both arms.
  default: next_open with lag_bars 1, as the article's registered circuits run
  alternatives:
  - same_close
  material: true
validation:
  oos_start: 2026-08-24
  is_oos_split: publication_date
  param_sweep:
    breadth_min:
    - 1
    - 2
    - 3
    - 4
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 20
  - 50
  null_tests:
  - random_entry_matched_exposure
  - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
  report: reports/the-crash-switch-worked-and-the-strategy-starved-anyway-kell.md
