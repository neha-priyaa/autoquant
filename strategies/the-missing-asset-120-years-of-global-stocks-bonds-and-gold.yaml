meta:
  slug: "the-missing-asset-120-years-of-global-stocks-bonds-and-gold"
  title: "The Missing Asset: 120 Years of Global Stocks, Bonds and Gold Through Inflation Regimes"
  url: "https://beyondpassive.substack.com/p/the-missing-asset-120-years-of-global"
  source: "Beyond Passive"
  posted: 2026-09-08
  claim: >-
    A price-only annual trend rule that reduces sleeve exposure after a bad year
    cuts maximum drawdown from 59% to 17% and removes a third of volatility on an
    equal-thirds global stocks-bonds-gold portfolio over 120 years.
  author_evidence:
    sample: "1901-2020, 16-country equal-weight global stocks and bonds plus gold, real USD, JST Macrohistory Database"
    headline_metrics: { cagr: null, sharpe: null, max_dd: -0.17 }
    costs_included: false
data:
  universe: [EFA, BND, GLD]
  bar: 1d
  fields: [close]
  start: 1901-01-01
  end: null
  source: yfinance
  caveats:
    - "Article uses 16-country equal-weight sleeves from JST Macrohistory Database; mapped to broad ETF proxies (EFA, BND, GLD) which do not replicate the exact equal-weight 16-country composition."
    - "Article reports real (CPI-deflated) returns; Yahoo Finance data is nominal."
    - "ETF data begins in the 2000s; the 1901-2020 sample period cannot be reproduced from Yahoo Finance."
    - "Survivorship bias: the 16-country historical universe includes countries no longer independently investable (e.g. Portugal, pre-Euro Italy)."
    - "Bond sleeve approximated by BND (US aggregate); article uses long government bonds across 16 countries."
    - "Gold price series differs from the MeasuringWorth London price used in the article."
signal:
  definition: >-
    For each sleeve: ret_1y = close.pct_change(252); vol_10y = ret_1y.rolling(2520).std();
    raw = (ret_1y / vol_10y).clip(-1, 1); weight_sleeve = (1/3) * (1 + raw);
    weight_cash = 1 - weight_stocks - weight_bonds - weight_gold.
  lookback_bars: 2520
  lag_bars: 1
rules:
  entry: "raw signal rises above -1 (any positive trend signal adds exposure)"
  exit: "raw signal falls to -1 (worst-year signal zeroes exposure)"
  direction: long_only
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: annual
  execution_price: next_open
costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
  - id: signal_formula
    question: "Article describes the signal conceptually (last year's return / trailing 10-year volatility, clipped to [-1,1]) but does not provide a precise formula. The z-score normalization, clipping range, and weight formula are reconstructed from the narrative."
    default: "raw = (ret_1y / vol_10y).clip(-1, 1); weight = (1/3) * (1 + raw)"
    alternatives: ["raw = (ret_1y / vol_10y).clip(-2, 2)", "raw = tanh(ret_1y / vol_10y)"]
    material: true
  - id: equal_weight_assumption
    question: "Are the three sleeves (stocks, bonds, gold) equal-weighted at one-third each, or does the allocation differ?"
    default: one-third each
    alternatives: ["40/40/20 stocks/bonds/gold", "risk-parity weighting"]
    material: true
  - id: bond_maturity
    question: "What maturity defines 'long government bonds' in the bond sleeve?"
    default: 10Y+ (long end of the yield curve)
    alternatives: ["20Y+", "30Y+", "mixed maturities"]
    material: true
  - id: gold_data_source
    question: "What historical gold price series is used pre-ETF? Article cites MeasuringWorth London price."
    default: "London gold price (MeasuringWorth)"
    alternatives: ["COMEX gold futures", "LBMA gold price"]
    material: false
  - id: rebalance_timing
    question: "Exact date within the year for rebalancing? Article says 'rebalances every year' and 'multiplier for year t is fixed at the end of year t-1'."
    default: year-end (December 31)
    alternatives: ["year-start (January 1)", "rolling 12-month from last trade"]
    material: false
  - id: data_source_mismatch
    question: "Article uses JST Macrohistory Database (not available via yfinance). ETF data starts in the 2000s, covering only ~20 years of the 120-year sample."
    default: "Use available ETF data starting from earliest inception (~2003)"
    alternatives: ["Use JST data directly if accessible", "Use synthetic reconstruction from country indices"]
    material: true
  - id: universe_approximation
    question: "The 16-country equal-weight portfolio is approximated by EFA/BND/GLD, which do not replicate the exact country weights or composition."
    default: "EFA (international developed) + BND (US aggregate bond) + GLD (gold)"
    alternatives: ["Individual country ETFs where available", "VT (total world) + BND + GLD"]
    material: true
  - id: trend_no_leverage
    question: "The daily version of this rule uses leverage (volatility target scaling); the annual version explicitly has none. Should the test allow leverage?"
    default: "no leverage (max_leverage: 1.0)"
    alternatives: ["Volatility target at 10%", "Volatility target at 15%"]
    material: false
  - id: execution_price_annual
    question: "With annual bars, the decision is at year-end and executes the next year. Is 'next_open' the January 1 open or the next available trading day?"
    default: "January 1 open (first trading day of the new year)"
    alternatives: ["December 31 close (same bar)"]
    material: false
validation:
  oos_start: 2026-09-08
  is_oos_split: publication_date
  param_sweep:
    lookback_bars: [1260, 1890, 2520, 3150, 3780]
  cost_sweep_bps: [0, 5, 10, 20, 50]
  null_tests:
    - random_entry_matched_exposure
    - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
