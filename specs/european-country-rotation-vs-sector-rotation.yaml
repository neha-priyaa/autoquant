meta:
  slug: european-country-rotation-vs-sector-rotation
  title: European country rotation vs sector rotation
  url: https://quanterlab.com/research/what-a-european-country-fund-is-made-of-and-whether-the-country-part-is-worth
  source: Quanter Lab
  posted: 2026-09-08
  claim: 'Rotating the ten USD-listed iShares global sector ETFs monthly on trailing
    12-month momentum (holding the top three equally) beats holding the ten European
    single-country ETFs equally on compounded return, and its edge comes from sector
    exposure rather than any country-level signal.

    '
  author_evidence:
    sample: 2008-01-02 to 2025-12-31, eighteen registered one-year walk-forward windows,
      USD-listed iShares MSCI country and global sector ETFs
    headline_metrics:
      cagr: 0.079
      sharpe: 0.5
      max_dd: -0.534
      growth_of_one_dollar: 3.90x
      mean_window_sharpe: 0.9
    costs_included: true
data:
  universe:
  - IXN
  - IXJ
  - IXG
  - IXC
  - IXP
  - MXI
  - EXI
  - KXI
  - RXI
  - JXI
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2006-09-01
  end: null
  source: yfinance
  caveats:
  - "Fixed list of ten sector ETFs that all exist today \u2014 no point-in-time membership,\
    \ survivorship bias possible."
  - The last five sector funds (IXP, MXI, EXI, KXI, RXI) list in Sept 2006, bounding
    the usable history; data before that is unavailable.
  - Article returns are total return net of fund expense ratios; yfinance adjusted
    closes approximate this but dividend handling may differ.
  - "The reported cell (sector, 12m, ungated) is the best of a declared 30-cell pre-registered\
    \ family, selected on highest mean window Sharpe \u2014 selection bias within\
    \ the family remains even though all 30 are reported."
  - Author benchmarks against an equal-weight ten-country ETF book and IEV, not SPY;
    verdicts should use the same rulers.
signal:
  definition: mom = close / close.shift(252) - 1 per ticker, computed at each month-end;
    rank ten sector funds by mom descending; selected = top 3 tickers, weight 1/3
    each
  lookback_bars: 252
  lag_bars: 1
rules:
  entry: ticker enters the top-3-by-trailing-12m-return basket at the month-end rank;
    buy at the next session
  exit: ticker drops out of the top-3 basket at the next month-end rank; sell at the
    next session
  direction: long_only
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: monthly
  execution_price: next_open
costs:
  commission_bps: 10.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: execution_session_time
  question: Within the 'next session', does the trade execute at the open or the close?
  default: next_open
  alternatives:
  - next_close
  material: false
- id: momentum_convention
  question: Is the trailing twelve-month return measured over 252 trading sessions
    or 12 calendar months?
  default: 252_trading_sessions
  alternatives:
  - calendar_12_months
  material: false
- id: cost_split
  question: How does the article's 10 bps per side split between commission and slippage?
  default: commission_10_slippage_0
  alternatives:
  - commission_1_slippage_9
  - commission_0_slippage_10
  material: false
- id: rank_tie_breaking
  question: How are ties in the momentum ranking broken?
  default: stable_order_by_ticker
  alternatives:
  - random_tie_break
  material: false
- id: universe_currency
  question: Sector ETFs are USD-listed but hold global firms; should any currency
    hedge be applied as in the article's framing?
  default: unhedged_usd_listed
  alternatives:
  - eur_hedged
  material: true
validation:
  oos_start: 2026-09-08
  is_oos_split: publication_date
  param_sweep:
    lookback_bars:
    - 63
    - 126
    - 252
    n_holdings:
    - 1
    - 3
    - 5
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 20
  - 50
  null_tests:
  - random_entry_matched_exposure
  - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
  report: reports/european-country-rotation-vs-sector-rotation.md
