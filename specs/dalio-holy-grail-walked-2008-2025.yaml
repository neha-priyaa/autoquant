meta:
  slug: dalio-holy-grail-walked-2008-2025
  title: Dalio Holy Grail walked 2008-2025
  url: https://quanterlab.com/research/dalio-s-holy-grail-measured-and-then-walked-at-five-breadths-three-five-seven-te
  source: Quanter Lab
  posted: 2026-09-03
  claim: 'A fifteen-fund equal-risk-contribution ETF portfolio, re-estimated quarterly
    from trailing 252-day returns, beats a 60/40 SPY/AGG benchmark on risk-adjusted
    return because menu breadth alone diversifies the liquid ETF shelf.

    '
  author_evidence:
    sample: 2008-01-02 to 2025-12-31, eighteen one-year walk-forward windows, fifteen
      liquid ETFs, total return net of costs
    headline_metrics:
      cagr: 0.0378
      sharpe: 0.6
      max_dd: -0.191
    costs_included: true
data:
  universe:
  - SPY
  - IWM
  - EFA
  - EWJ
  - VWO
  - TLT
  - IEF
  - TIP
  - LQD
  - AGG
  - GLD
  - SLV
  - DBC
  - VNQ
  - FXE
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2006-04-28
  end: null
  source: yfinance
  caveats:
  - Article uses total return with dividends credited from the payment record; yfinance
    adjusted prices approximate this.
  - SLV first trades 2006-04-28 and is the youngest fund; it gates the 252-day estimation
    window and thus the January 2008 walk start.
  - No point-in-time share-class history; all fifteen names are large surviving ETFs
    (mild survivorship bias).
signal:
  definition: 'rets = close.pct_change(); cov = rets.rolling(252).cov(); w = erc_weights(cov)  #
    long-only weights solving w_i * (Cov w)_i equal for all i, sum(w)=1; hold w across
    the fifteen-fund universe until the next quarterly re-estimation'
  lookback_bars: 252
  lag_bars: 1
rules:
  entry: always invested once 252 days of history exist; hold the ERC weights across
    all fifteen funds
  exit: never exit; weights are only re-estimated
  direction: long_only
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: quarterly
  execution_price: next_open
costs:
  commission_bps: 10.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: which_arm
  question: The article is a comparative walk (trio vs fifteen-fund shelf under ERC);
    which book is the strategy under test?
  default: fifteen_fund_erc_shelf
  alternatives:
  - trio_erc_spy_tlt_gld
  material: true
- id: execution_timing
  question: At which price are quarterly rebalance trades filled?
  default: next_open
  alternatives:
  - same_close
  material: false
- id: cost_split
  question: The article charges ten basis points per one-way traded dollar (slippage
    + commission combined); how is the split made?
  default: 10 bps commission, 0 bps slippage (combined total preserved)
  alternatives:
  - 5 bps commission + 5 bps slippage
  - 1 bps commission + 9 bps slippage
  material: false
- id: covariance_estimator
  question: Which covariance/correlation estimator feeds the ERC solver?
  default: sample_covariance_trailing_252d
  alternatives:
  - ledoit_wolf_shrinkage
  material: false
- id: rebalance_dates
  question: Quarterly re-estimation occurs on which dates?
  default: first_trading_day_of_jan_apr_jul_oct
  alternatives:
  - quarterly_anchored_to_2008_study_start
  material: false
validation:
  oos_start: 2026-09-03
  is_oos_split: publication_date
  param_sweep:
    lookback_bars:
    - 126
    - 189
    - 252
    - 378
    - 504
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 20
