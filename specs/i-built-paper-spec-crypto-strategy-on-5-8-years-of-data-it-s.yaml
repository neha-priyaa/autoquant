meta:
  slug: i-built-paper-spec-crypto-strategy-on-5-8-years-of-data-it-s
  title: I built paper-spec crypto strategy on 5.8 years of data. It's lost money
    every year since 2024
  url: https://stratproof.com/blog/crypto-cross-sectional-momentum-does-not-work-anymore
  source: Strat Proof
  posted: 2026-09-03
  claim: "A cross-sectional momentum strategy on 10 crypto majors \u2014 long the\
    \ top 3 and short the bottom 3 by prior 7-day close-to-close return, 1/6 of book\
    \ each, rebalanced every 7 days \u2014 earns positive risk-adjusted returns net\
    \ of costs.\n"
  author_evidence:
    sample: 2020-10-31 to 2026-09-02, daily closes from Binance spot, 10 majors, 303
      weekly rebalances
    headline_metrics:
      weekly_mean_return: 0.0023
      weekly_return_std: 0.045
      annualized_sharpe: 0.37
      max_dd: -0.417
      terminal_equity: 1.47
      sharpe_gt_zero_probability: 0.81
    costs_included: true
data:
  universe:
  - BTC
  - ETH
  - SOL
  - XRP
  - DOGE
  - BNB
  - ADA
  - AVAX
  - LINK
  - LTC
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2020-10-31
  end: 2026-09-02
  source: binance_spot
  caveats:
  - "Universe is 10 majors chosen by the author today from survivors \u2014 the 2020\
    \ universe of large-caps differed; survivorship/selection bias in the cross-section."
  - No point-in-time universe construction; ranks depend on the ex-post chosen set.
  - Binance spot closes; the author ran costs as perp taker plus spread, a venue mismatch.
  - Funding costs on the short legs omitted by the author (v1 simplification).
signal:
  definition: ret_7d = close.pct_change(7); rank = ret_7d.rank(ascending=False); long_rank
    = rank <= 3; short_rank = rank >= 8
  lookback_bars: 8
  lag_bars: 1
rules:
  entry: at weekly rebalance, enter long if asset is in top 3 of the trailing 7-day
    return ranking; enter short if in bottom 3
  exit: at next weekly rebalance, exit any asset no longer in its ranked bucket
  direction: long_short
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: weekly
  execution_price: next_open
costs:
  commission_bps: 15.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: execution_timing
  question: "Ranking uses weekly closes \u2014 does execution happen at that close\
    \ or the next bar's open?"
  default: next_open
  alternatives:
  - same_close
  material: true
- id: cost_split
  question: Author reports a combined 0.15% per leg (taker fee plus spread); how does
    it split between commission and slippage?
  default: commission_bps 15.0 with slippage_bps 0.0 (total preserved)
  alternatives:
  - commission_bps: 10.0
    slippage_bps: 5.0
  - commission_bps: 5.0
    slippage_bps: 10.0
  material: false
- id: funding_costs
  question: "Perp funding on the short (and long) legs was explicitly omitted in the\
    \ author's v1 \u2014 include funding or not?"
  default: omit (financing_bps_annual 0.0, matching the paper spec baseline)
  alternatives:
  - historical_perp_funding_applied
  material: true
- id: turnover_assumption
  question: Author's cost cap assumed full turnover every week; backtest at realized
    or worst-case turnover?
  default: realized turnover from actual rank changes
  alternatives:
  - full_turnover_worst_case
  material: false
- id: rebalance_anchor
  question: Which weekday anchors the 7-day rebalance cycle?
  default: every 7 daily bars from data.start (rolling, matches 303 rebalances over
    the sample)
  alternatives:
  - calendar_week_monday
  - calendar_week_sunday
  material: false
- id: short_leg_mechanics
  question: "Shorts are specified on a spot-derived signal but costed as perps \u2014\
    \ are shorts executed on spot borrow or perps?"
  default: perp shorts with zero borrow cost (consistent with the author's cost description)
  alternatives:
  - spot_borrow_shorts_with_borrow_cost
  material: true
validation:
  oos_start: 2026-09-03
  is_oos_split: publication_date
  param_sweep:
    lookback_bars:
    - 5
    - 7
    - 10
    - 14
    - 21
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 15
  - 30
  null_tests:
  - random_entry_matched_exposure
  - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
  report: reports/i-built-paper-spec-crypto-strategy-on-5-8-years-of-data-it-s.md
