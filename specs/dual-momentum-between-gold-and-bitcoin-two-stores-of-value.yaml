meta:
  slug: dual-momentum-between-gold-and-bitcoin-two-stores-of-value
  title: Dual Momentum Between Gold and Bitcoin (Two Stores of Value)
  url: https://aligrithm.com/dual-momentum-between-gold-and-bitcoin-two-stores-of-value/
  source: Aligrithm
  posted: 2026-08-15
  claim: 'A weekly dual-momentum switch between GLD and IBIT (long the 8-week lookback
    winner only if its 8-week return is positive, else cash) beats buy-and-hold of
    either leg and a 50/50 blend on risk-adjusted return.

    '
  author_evidence:
    sample: 31 Dec 2018 - April 2026, weekly Wednesday, GLD and a Bitcoin splice (Bitfinex
      BTC -> BITO -> IBIT), rf = 0%
    headline_metrics:
      cagr: 0.7991
      sharpe: 1.64
      max_dd: -0.4394
    costs_included: false
data:
  universe:
  - GLD
  - BITO
  - IBIT
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2021-10-19
  end: null
  source: yfinance
  caveats:
  - IBIT listed 2024-01-11; the author's 2018+ sample splices Bitfinex hourly BTC
    then BITO before IBIT, so everything before Jan 2024 is a proxy, not the live
    vehicle.
  - BITO is a futures-based fund with roll drag the author's Bitfinex BTC series does
    not have; the Bitfinex hourly splice is not reproducible from yfinance.
  - Earliest usable common start is BITO's listing 2021-10-19, which truncates the
    author's sample by three years; an IBIT-only start (2024-01-11) would leave almost
    no sample.
  - yfinance prices are split/dividend adjusted; the article does not state total-return
    vs price-only.
  - No point-in-time universe concern for GLD/BITO/IBIT as all are live ETFs, but
    the backtest still embeds survivorship of the author's chosen vehicles.
signal:
  definition: 'Weekly on Wednesday close: r_gld = GLD close-to-close return over the
    last 8 weeks (40 bars); r_btc = BITO/IBIT Bitcoin-leg return over the same 40
    bars; pick = argmax(r_gld, r_btc); hold pick if its 40-bar return > 0, otherwise
    cash. Never hold both names.

    '
  lookback_bars: 40
  lag_bars: 1
rules:
  entry: selected asset's 40-bar return exceeds the other's and is positive -> hold
    100% of that asset
  exit: other asset becomes the relative winner with positive return (switch), or
    both 40-bar returns <= 0 (go to cash)
  direction: long_only
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: weekly
  execution_price: next_open
costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: execution_timing
  question: The authors compute the signal and trade at the Wednesday close; can the
    same close be traded in practice?
  default: next_open with lag_bars 1
  alternatives:
  - same_close_at_wednesday
  material: true
- id: lookback_choice
  question: The article swept 10 lookbacks (1-28 weeks), published the 8-week peak,
    and built a composite from 4/8/12 - which lookback is the real rule?
  default: 8 weeks, the published headline spec, with the grid swept as a robustness
    neighbourhood
  alternatives:
  - 4wk
  - 6wk
  - 12wk
  - composite_4_8_12
  material: true
- id: bitcoin_proxy
  question: What is the tradable Bitcoin leg before IBIT's 2024 listing?
  default: BITO from 2021-10-19, acknowledging roll drag; Bitfinex hourly BTC splice
    not reproduced
  alternatives:
  - ibit_only_from_2024-01-11
  - bitfinex_hourly_splice
  material: true
- id: vol_cap_variant
  question: The article's preferred product overlays a 20% annualized vol cap (w =
    min(0.20 / 12wk_annualized_vol, 1)) on a 4/8/12 composite - is the headline the
    capped composite or the pure switch?
  default: pure full-notional 8-week switch as headline; capped composite tested as
    a variant
  alternatives:
  - vol_cap_20pct_on_composite_4_8_12
  - vol_cap_20pct_on_8wk
  material: true
- id: weekly_clock
  question: Is Wednesday special or an artifact of the chosen weekly clock?
  default: wednesday, as specified
  alternatives:
  - monday
  - friday
  material: false
- id: return_basis
  question: Total return (adjusted) or price-only returns for the lookback momentum?
  default: adjusted_close_total_return
  alternatives:
  - price_only
  material: false
validation:
  oos_start: 2026-08-15
  is_oos_split: publication_date
  param_sweep:
    lookback_bars:
    - 20
    - 30
    - 40
    - 60
    - 100
    - 120
    - 140
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 20
  - 50
  null_tests:
  - random_entry_matched_exposure
  - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
  report: reports/dual-momentum-between-gold-and-bitcoin-two-stores-of-value.md
