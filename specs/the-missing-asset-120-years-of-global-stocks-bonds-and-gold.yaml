meta:
  slug: the-missing-asset-120-years-of-global-stocks-bonds-and-gold
  title: 'The Missing Asset: 120 Years of Global Stocks, Bonds and Gold Through Inflation
    Regimes'
  url: https://beyondpassive.substack.com/p/the-missing-asset-120-years-of-global
  source: Beyond Passive
  posted: 2026-09-08
  claim: 'Scaling each sleeve of an equal-thirds 16-country equity / long-government-bond
    / gold portfolio by a price-only annual trend signal (prior calendar-year return
    divided by its trailing ten-year volatility, clipped to [-1, +1], exposure = one
    third times (0.5 + 0.5 * signal), no leverage or shorting, set at the end of the
    prior year) raises real USD compound return slightly and cuts maximum drawdown
    by roughly two thirds versus annual rebalancing, by reducing exposure in stagflation
    years.

    '
  author_evidence:
    sample: 1901-2020, real USD; 16-country equity and long government bond sleeves
      (JST Macrohistory Release 6), London gold price (MeasuringWorth), deflated by
      US CPI
    headline_metrics:
      cagr: null
      sharpe: null
      max_dd: -0.17
    costs_included: false
data:
  universe:
  - JST_EQ_AUS
  - JST_EQ_BEL
  - JST_EQ_DNK
  - JST_EQ_FIN
  - JST_EQ_FRA
  - JST_EQ_DEU
  - JST_EQ_ITA
  - JST_EQ_JPN
  - JST_EQ_NLD
  - JST_EQ_NOR
  - JST_EQ_PRT
  - JST_EQ_ESP
  - JST_EQ_SWE
  - JST_EQ_CHE
  - JST_EQ_GBR
  - JST_EQ_USA
  - JST_BOND_AUS
  - JST_BOND_BEL
  - JST_BOND_DNK
  - JST_BOND_FIN
  - JST_BOND_FRA
  - JST_BOND_DEU
  - JST_BOND_ITA
  - JST_BOND_JPN
  - JST_BOND_NLD
  - JST_BOND_NOR
  - JST_BOND_PRT
  - JST_BOND_ESP
  - JST_BOND_SWE
  - JST_BOND_CHE
  - JST_BOND_GBR
  - JST_BOND_USA
  - GOLD_LONDON
  bar: 1y
  fields:
  - close
  start: 1901-01-01
  end: 2020-12-31
  source: "Jord\xE0-Schularick-Taylor Macrohistory Database Release 6 (stocks, long\
    \ government bonds, US CPI, US real GDP per capita via Maddison); MeasuringWorth\
    \ annual London gold price"
  caveats:
  - Annual bars only; the author explicitly notes nobody trades on annual data and
    the investable version comes in a later article.
  - Gold price is fixed by statute before 1972, so the gold sleeve's pre-float behaviour
    is by construction, not a tradable response to inflation.
  - The 16-country universe is a historical academic dataset; eight countries now
    share a currency and the historical countries cannot be bought as listed. No point-in-time
    investability.
  - Wartime exchanges (Germany, Japan, others) had closures and controls; real USD
    returns across those episodes embed assumptions the database makes about continuity.
  - "Post-2020 checks in the article use ETF proxies with a Treasury-only bond sleeve\
    \ \u2014 not the same instruments; treated as outside the test sample."
  - Returns are unhedged USD, deflated by US CPI; if database series are price-only
    for some country-periods, sleeve total returns will differ from the author's.
signal:
  definition: 'per sleeve s: r1 = total return of s over calendar year t-1; vol10
    = std of s''s annual total returns over the trailing 10 years ending t-1; z =
    clip(r1 / vol10, -1.0, 1.0); weight_s(t) = (1/3) * (0.5 + 0.5 * z)'
  lookback_bars: 11
  lag_bars: 1
rules:
  entry: at the start of year t, hold each sleeve at weight (1/3)*(0.5+0.5*z_s) computed
    from data through end of t-1; full third when z_s = +1
  exit: scale each sleeve toward zero as its z_s declines; zero exposure when z_s
    = -1; remainder held in cash
  direction: long_only
  position_when_flat: cash
  sizing: fixed_fraction
  vol_target: null
  max_leverage: 1.0
  rebalance: annually at the start of year t (multiplier fixed at end of t-1, never
    revised)
  execution_price: next_open
costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: data_proxy
  question: "The author's sleeves are academic JST series \u2014 what should the backtest\
    \ actually source for 1901-2020?"
  default: JST Macrohistory Release 6 equity and long-government-bond total-return
    series per country, equal-weighted into sleeves; MeasuringWorth London gold; US
    CPI deflator
  alternatives:
  - ETF proxies (only back to early 2000s, Treasuries-only bond sleeve)
  - GFD or other commercial historical database
  material: true
- id: return_type
  question: Are the country sleeve returns total returns (with dividends/coupons)
    or price-only?
  default: total returns where the database provides them
  alternatives:
  - price_only
  material: true
- id: execution_timing
  question: Within year t, at what price is the pre-set multiplier executed?
  default: next_open
  alternatives:
  - same_close
  material: false
- id: flat_asset
  question: Does the un-invested remainder (average exposure 0.55) earn anything?
  default: cash_zero
  alternatives:
  - tbill_1y_us
  material: true
- id: costs
  question: "The article defers real costs to a later article \u2014 what costs apply\
    \ to the annual test?"
  default: 1 bp commission + 5 bp slippage per side
  alternatives:
  - zero costs (author's implied baseline)
  - higher institutional costs on historical sleeves
  material: false
- id: vol_estimator
  question: "Trailing ten-year volatility \u2014 simple standard deviation of annual\
    \ returns, and which ddof?"
  default: simple std of the 10 annual returns, ddof=1
  alternatives:
  - population_std
  - ewma
  material: false
- id: rule_start
  question: "The signal needs 10 prior years of returns, yet results are reported\
    \ from 1901 \u2014 what happens in the warm-up?"
  default: pull data from 1890 for warm-up and start the rule at 1901; if pre-1901
    data is unavailable, start the rule at the first year with a full 10-year window
  alternatives:
  - start_rule_1912_with_full_window_only
  material: false
- id: sleeve_weighting_drift
  question: Does the equal-weighted sleeve rebalance within the year, or only annually
    with the signal?
  default: rebalance to target weights once per year, at the start of year t
  alternatives:
  - continuous_drift_within_year
  material: false
validation:
  oos_start: 2026-09-08
  is_oos_split: publication_date
  param_sweep:
