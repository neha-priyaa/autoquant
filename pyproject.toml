[project]
name = "autoquant"
version = "0.1.0"
description = "Research workspace for turning published quantitative ideas into falsifiable backtests"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "pandas-datareader>=0.11.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "arch>=8.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nltk>=3.10.3",
    "pytest>=8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
