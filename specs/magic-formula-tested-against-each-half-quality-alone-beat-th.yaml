meta:
  slug: magic-formula-tested-against-each-half-quality-alone-beat-th
  title: 'Magic Formula tested against each half: quality alone beat the combination'
  url: https://quanterlab.com/research/one-half-of-the-magic-formula-beat-the-whole-thing-greenblatt-s-two-ranks-tested
  source: Quanter Lab
  posted: 2026-08-27
  claim: 'Holding the thirty S&P 500 names ranked highest on return on capital (ROIC)
    alone, equal-weighted with annual reselection, outperforms the equal blend of
    ROIC and earnings-yield ranks (the Magic Formula) on return, volatility, Sharpe
    ratio and drawdown over 2006-2025.

    '
  author_evidence:
    sample: 2006-01-03 to 2025-12-31, twenty one-year out-of-sample windows, point-in-time
      S&P 500 constituents, benchmark equal-weight S&P 500 (RSP) rebuilt as total
      return
    headline_metrics:
      cagr: 0.1173
      sharpe: 0.65
      max_dd: -0.529
    costs_included: true
data:
  universe:
    rule: S&P 500 constituents as of each rebalance date (point-in-time membership)
    point_in_time_source: null
  bar: 1d
  fields:
  - open
  - high
  - low
  - close
  - volume
  start: 2004-01-02
  end: null
  source: yfinance
  caveats:
  - Article uses point-in-time S&P 500 membership from an index change-log; yfinance-based
    replication can only use current constituents, so delisted/removed names are absent
    (survivorship bias).
  - Article gates fundamentals on SEC acceptedDate; yfinance provides only current
    and shallow-history fundamentals, so ROIC must be reconstructed from lagged annual
    statements (lookahead risk).
  - Article is the large-cap reading of the formula; the original book screens all
    caps above $50m.
  - yfinance prices are split/dividend adjusted; article credits dividends at ex-date
    as cash held to next rebalance.
signal:
  definition: 'At each annual anchor date, for each S&P 500 constituent, compute ROIC
    = NOPAT / invested capital from the most recent fundamentals filing whose SEC
    acceptedDate is strictly before the anchor. Cross-sectionally rank all constituents
    by ROIC descending (rank method: ordinal by ROIC value; the article''s platform
    averages standardised scores, see ambiguities). Select the 30 highest-ranked names.
    raw = membership in the top-30 set.'
  lookback_bars: 504
  lag_bars: 1
rules:
  entry: name enters the top-30 ROIC-ranked basket at the annual reselection
  exit: name drops out of the top-30 basket at the annual reselection
  direction: long_only
  position_when_flat: cash
  sizing: full_notional
  vol_target: null
  max_leverage: 1.0
  rebalance: annual
  execution_price: next_open
costs:
  commission_bps: 10.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  financing_bps_annual: 0.0
ambiguities:
- id: universe_point_in_time
  question: Can S&P 500 membership be reconstructed point-in-time from the available
    data?
  default: current constituent list only, survivorship-biased
  alternatives:
  - pit_index_changelog
  - crsp_delisting_adjusted
  material: true
- id: fundamentals_availability
  question: Fundamentals are gated on SEC acceptedDate in the article; does the data
    source provide point-in-time historical fundamentals?
  default: use most recent annual statement filed at least 90 days before the anchor
    date
  alternatives:
  - acceptedDate_gate_if_available
  - lag_6_months
  material: true
- id: roic_proxy
  question: Article uses NOPAT / invested capital as a stand-in for Greenblatt's EBIT
    / (net working capital + net fixed assets); which ROIC definition?
  default: roic_nopat_over_invested_capital
  alternatives:
  - ebit_over_nwc_plus_nfa
  - roe
  - roa
  material: true
- id: score_normalization
  question: Article's platform averages standardised (z-scored) factors rather than
    summing Greenblatt's rank positions, and flags that this changes the ordering;
    which normalisation for the single-factor quality rank?
  default: ordinal rank on raw ROIC (for a single factor, rank and z-score produce
    the same ordering)
  alternatives:
  - winsorized_zscore
  - percentile
  material: false
- id: rebalance_date
  question: Which date each year is the reselection anchor?
  default: first trading day of January (matches the article's window starts)
  alternatives:
  - first_trading_day_of_quarter
  - anniversary_of_first_anchor
  material: false
- id: execution_timing
  question: The article does not state whether the annual reselection trades at the
    anchor close or the next open.
  default: next_open
  alternatives:
  - same_close
  material: false
- id: dividend_treatment
  question: Dividends are credited at ex-date and held as cash until the next rebalance;
    replicate exactly or reinvest immediately?
  default: cash_until_next_rebalance
  alternatives:
  - immediate_reinvestment
  material: false
- id: cost_structure
  question: Article charges ten basis points per one-way traded dollar without splitting
    commission and slippage.
  default: commission_bps 10, slippage_bps 0 (single bundled charge per side)
  alternatives:
  - commission_1_slippage_9
  - commission_5_slippage_5
  material: false
- id: data_start_warmup
  question: First OOS window starts 2006-01-03 but each anchor needs pre-anchor fundamentals
    for ranking; how much lead-in data is required?
  default: start data 2004-01-02 to give two years of statements before the first
    anchor
  alternatives:
  - start_2006_with_lagged_statements
  - start_2003
  material: false
validation:
  oos_start: 2026-08-27
  is_oos_split: publication_date
  param_sweep:
    top_n:
    - 20
    - 30
    - 50
    quality_metric:
    - roic_nopat_over_invested_capital
    - roe
    - roa
  cost_sweep_bps:
  - 0
  - 5
  - 10
  - 20
  - 50
  null_tests:
  - random_entry_matched_exposure
  - shuffled_signal
  min_trades: 30
  multiple_testing:
    n_tested_so_far: null
    method: deflated_sharpe
verdict:
  status: PENDING
  reason: null
  report: reports/magic-formula-tested-against-each-half-quality-alone-beat-th.md
