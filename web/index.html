<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoQuant — research the idea. test the evidence.</title>
    <meta name="description" content="Turn quantitative research into explicit trading hypotheses, reproducible backtests, and evidence you can inspect." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var ok = ["dark", "light", "terminal", "amber"];
        var t = localStorage.getItem("aq-theme");
        if (ok.indexOf(t) === -1) {
          t = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
